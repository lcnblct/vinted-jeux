- name: Cascadia
  url: https://www.vinted.fr/catalog?search_text=cascadia&order=newest_first&catalog_ids=4881
  price_max: 22
  must_contain:
  - cascadia
- name: Frosted Blooms
  url: https://www.vinted.fr/catalog?search_text=frosted%20blooms&order=newest_first&catalog_ids=4881
  price_max: 16
  must_contain:
  - frosted
  - blooms
- name: Koi
  url: https://www.vinted.fr/catalog?search_text=koi&order=newest_first&catalog_ids=4881
  price_max: 27
  must_contain:
  - koi
- name: L'Ile Des Chats
  url: https://www.vinted.fr/catalog?search_text=ile%20des%20chats&order=newest_first&catalog_ids=4881
  price_max: 29
  must_contain:
  - ile
  - chats
  # Exception à la règle must_not_contain vide : spin-off au sous-titre stable
  # (Explore & Draw = autre jeu, même univers — le LLM confondait les chartes).
  # Ne jamais figurer sur la boîte du jeu de base.
  must_not_contain:
  - explore
  - draw
- name: Next Station London
  url: https://www.vinted.fr/catalog?search_text=next%20station%20london&order=newest_first&catalog_ids=4881
  price_max: 9
  must_contain:
  - next
  - station
  - london
- name: Next Station Paris
  url: https://www.vinted.fr/catalog?search_text=next%20station%20paris&order=newest_first&catalog_ids=4881
  price_max: 9
  must_contain:
  - next
  - station
  - paris
- name: Patchwork 10e Anniversaire
  url: https://www.vinted.fr/catalog?search_text=patchwork&order=newest_first&catalog_ids=4881
  price_max: 15
  must_contain:
  - patchwork
  # Variantes connues qui portent le mot Patchwork mais sont d'autres jeux.
  # Elles sont rejetées avant l'appel LLM pour éviter un faux positif coûteux.
  must_not_contain:
  - doodle
  - express
  - folklore
  - halloween
  - winter
  - automa
- name: Rebirth
  url: https://www.vinted.fr/catalog?search_text=rebirth&order=newest_first&catalog_ids=4881
  price_max: 23
  must_contain:
  - rebirth
- name: Take It Easy!
  url: https://www.vinted.fr/catalog?search_text=take%20it%20easy&order=newest_first&catalog_ids=4881
  price_max: 16
  must_contain:
  - take
  - easy
- name: Windmill Valley
  url: https://www.vinted.fr/catalog?search_text=windmill%20valley&order=newest_first&catalog_ids=4881
  price_max: 36
  must_contain:
  - windmill
  - valley
settings:
  poll_interval: 60
  per_page: 20
  database: seen.db
  base_url: https://www.vinted.fr
  # Fraîcheur : ignore les annonces plus vieilles que X jours (via timestamp
  # photo, proxy date création — l'API search n'a pas de champ date).
  # 0 = désactivé. Surcharge possible par jeu (max_age_days sous la query).
  max_age_days: 3
  # Filtre LLM vision anti faux positifs (Qwen 3.7 Flash via OpenRouter)
  llm_filter:
    enabled: true
    model: qwen/qwen3.7-flash
    confidence_threshold: 0.6   # <0.6 incertain → laisse passer (fail-open)
    max_images: 2               # photos envoyées au LLM (1-3, 2 = bon compromis coût/latence)
filters:
  exclude_sold: true
  only_french: true
  must_contain: []
  must_not_contain: []
