name: Vinted Jeux — Watchlist FR

on:
  schedule:
    # 7h-22h30 Paris toutes les 30min ≈ 32 runs/jour
    # été: 5h07-20h37 UTC (CEST UTC+2) | hiver: 6h07-21h37 UTC (CET UTC+1)
    # Minutes 7,37 (hors :00/:30) : GitHub saute les crons à l'heure pile en période de charge
    - cron: "7,37 5-20 * * *"
  push:
    paths:
      - "config.yaml"
  workflow_dispatch:

# Évite 2 runs qui se chevauchent si un run dépasse 15min
concurrency:
  group: vinted-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5          # kill si bloqué (évite de bouffer le quota)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps (cache pip)
        run: pip install -r requirements.txt

      - name: Run monitor (13 jeux, -7€, 30min, FR+LLM Qwen)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: qwen/qwen3.7-flash
        run: |
          python monitor.py --once --verbose || true
          ls -lh seen.db telegram_history.log 2>&1 || true
          sqlite3 seen.db "SELECT COUNT(*) FROM seen;" || true
          echo "--- history tail ---"
          tail -n 20 telegram_history.log 2>&1 || echo "no history yet"
          echo "--- meta ---"
          sqlite3 seen.db "SELECT * FROM meta;" 2>&1 || echo "no meta"

      - name: Commit seen.db + history (anti-doublons + audit)
        run: |
          git config user.name "vinted-bot"
          git config user.email "bot@github.invalid"
          # Assure que l'historique existe même au premier run sans envoi
          [ -f telegram_history.log ] || echo "# telegram_history.log — audit des envois réels (Paris ISO | TYPE | id | title | price | url | jeu)" > telegram_history.log
          git pull --rebase || true
          git add seen.db telegram_history.log 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update seen.db + history [skip ci]" || true
          git push || echo "push skipped"

      - name: Sync bot description (watchlist → Telegram)
        if: github.event_name == 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python scripts/update_bot_description.py || echo "skip bot desc"
