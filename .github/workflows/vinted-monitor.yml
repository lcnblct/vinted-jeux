name: Vinted Jeux — Watchlist FR (-10€)

on:
  schedule:
    # 7h30-22h30 Paris toutes les 30min = 31 runs/jour
    # été: 5h30-20h30 UTC (CEST UTC+2) | hiver: 6h30-21h30 UTC (CET UTC+1)
    # 5:30 + 6:00,6:30,7:00...20:00,20:30 UTC → 7:30,8:00,8:30...22:00,22:30 Paris (été)
    - cron: "30 5 * * *"
    - cron: "0,30 6-20 * * *"
  push:
    paths:
      - "config.yaml"
  workflow_dispatch:

# Évite 2 runs qui se chevauchent si un run dépasse 15min
concurrency:
  group: vinted-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5          # kill si bloqué (évite de bouffer le quota)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps (cache pip)
        run: pip install -r requirements.txt

      - name: Run monitor (13 jeux, -7€, 30min, FR+LLM Qwen)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: qwen/qwen3.7-flash
        run: |
          python monitor.py --once --verbose || true
          ls -lh seen.db telegram_history.log 2>&1 || true
          sqlite3 seen.db "SELECT COUNT(*) FROM seen;" || true
          echo "--- history tail ---"
          tail -n 20 telegram_history.log 2>&1 || echo "no history yet"
          echo "--- meta ---"
          sqlite3 seen.db "SELECT * FROM meta;" 2>&1 || echo "no meta"

      - name: Commit seen.db + history (anti-doublons + audit)
        run: |
          git config user.name "vinted-bot"
          git config user.email "bot@github.invalid"
          git pull --rebase || true
          git add seen.db telegram_history.log 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update seen.db [skip ci]" || true
          git push || echo "push skipped"

      - name: Sync bot description (watchlist → Telegram)
        if: github.event_name == 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python scripts/update_bot_description.py || echo "skip bot desc"
