name: Vinted Jeux — Watchlist FR (-10€)

on:
  schedule:
    # 7h30-22h30 Paris = 5h30-20h30 UTC été (6h30-21h30 UTC hiver) → 5-20 UTC
    # toutes les heures à :30 → 16 runs/jour ×1min ≈480min/mois <2000 — clair, toujours à la demie
    - cron: "30 5-20 * * *"
  push:
    paths:
      - "config.yaml"
  workflow_dispatch:

# Évite 2 runs qui se chevauchent si un run dépasse 15min
concurrency:
  group: vinted-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5          # kill si bloqué (évite de bouffer le quota)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps (cache pip)
        run: pip install -r requirements.txt

      - name: Restore seen.db (cache)
        uses: actions/cache@v4
        with:
          path: seen.db
          key: vinted-seen-${{ hashFiles('config.yaml') }}-v2
          restore-keys: vinted-seen-

      - name: Run monitor (14 jeux, -10€, FR only)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python monitor.py --once --verbose || true
          ls -lh seen.db || echo "no db"
          sqlite3 seen.db "SELECT COUNT(*) FROM seen;" || true

      - name: Commit seen.db (anti-doublons)
        run: |
          git config user.name "vinted-bot"
          git config user.email "bot@github.invalid"
          git pull --rebase || true
          git add seen.db 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update seen.db [skip ci]" || true
          git push || echo "push skipped"

      - name: Sync bot description (watchlist → Telegram)
        if: github.event_name == 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python scripts/update_bot_description.py || echo "skip bot desc"
